[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# Public values only: the shared HintWise Supabase project and its anon key (claude-built-apps
# platform/supabase.json), public by design and shipped in the browser bundle. Never the
# service-role key: nothing in this app uses one, and vite.config.js refuses to build a Netlify
# deploy with any other project or a key whose role is not anon. These override the site's
# old VITE_SUPABASE_* variables, which name the deleted project. The functions carry the same
# two values in netlify/functions/_lib/supabase.js (functions do not see this section).
[build.environment]
  VITE_SUPABASE_URL = "https://auth.hintwise.org"
  VITE_SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFya3R4bHJseWNlZmZ5b3pkd2hxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY4ODEwMTAsImV4cCI6MjA5MjQ1NzAxMH0.Vuku-irT3kAHZYibK23q6dpyOEqV_Eg5zB78I3dyshE"

[dev]
  command = "npm run dev"
  port = 5173
  targetPort = 5173

# The primary address is ranked-voting.hintwise.org. Send the old netlify.app
# address there, path and query kept, so a sign-in never starts on one host and
# returns to the other (its session would be stored on the wrong host). These
# rules match only the netlify.app host, so the new host never loops; deploy
# previews use other hosts and are not affected. They come first, before the
# /api/* rule, so the old host serves nothing itself. The app calls /api/* on
# its own host; an outside client still posting to the old host's /api/* would
# get the 301, which many clients follow as a GET, so it should move too.
[[redirects]]
  from = "https://ranked-voting.netlify.app/*"
  to = "https://ranked-voting.hintwise.org/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://ranked-voting.netlify.app/*"
  to = "https://ranked-voting.hintwise.org/:splat"
  status = 301
  force = true

# API routes go to Netlify Functions — must come BEFORE the SPA catch-all
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200
  force = true

# SPA fallback — all routes handled by React Router
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
